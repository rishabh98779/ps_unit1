<script>const COURSE_DATA = {"units": [{"id": "u1", "title": "Unit 1 — Basic Statistics: Central Tendency & Dispersion", "sub": "Official course blueprint: Lectures 1.1–1.5 + slide modules (Introduction, Central Tendency, Combined/Weighted Mean, Dispersion, Mean Deviation, Standard Deviation, Variance, Coefficient of Variation).", "topics": [{"id": "t11", "code": "Lecture 1.1", "title": "Introduction to Statistics & Probability", "sections": [{"type": "text", "title": "Introduction", "body": "Course ka yeh opening lecture do foundation concepts set karta hai — probability random events ke mathematical rules ka study hai, aur statistics usi probability ko real data par apply karne ka tool hai. Poori course ka base yahi hai, isliye definitions exam mein seedha poochhi jaati hain."}, {"type": "def", "title": "Formal Definition — Probability", "formal": "Probability theory is the study of the mathematical rules that govern random events.", "hinglish": "Probability ka matlab hai random events (jinka outcome bina observe kiye pakka nahi hota) ko mathematical rules se analyze karna. Toss, die, experiment outcomes — in sab ke liye probability batati hai ki given assumptions ke saath hum kya conclude kar sakte hain.", "keywords": []}, {"type": "text", "title": "What is Randomness?", "body": "Informally, a random event is an event in which we do not know the outcome without observing it. Probability tells us what we can say about such events, given our assumptions about the possible outcomes. <span class='src'>[SOURCE]</span>"}, {"type": "def", "title": "Formal Definition — Statistics", "formal": "Statistics is the application of probability to the collection, analysis, and description of random data.", "hinglish": "Statistics raw data ko collect, analyze aur describe karne ke liye probability ki theory use karta hai. Iski help se hum experiments design karte hain, data summarize karte hain aur conclusions nikaalte hain.", "keywords": []}, {"type": "list", "title": "Statistics is used to (source list)", "items": ["Design experiments", "Summarize data", "Make conclusions about the world", "Explore complex data"]}, {"type": "list", "title": "Applications of Probability & Statistics (source list)", "items": ["Computer Science — Machine Learning, Data Mining, AI, Simulation, Image Processing, Computer Graphics, Visualization, Software Testing, Algorithms", "Electrical Engineering — Signal Processing, Telecommunications, Information Theory, Control Theory, Instrumentation/Sensors, Hardware Testing", "General — Gambling (not recommended), Stock Market, Politics, Sports, Demographics, Medicine, Economics, All Sciences"]}, {"type": "text", "title": "Engineering slide notes (enrichment from course slides)", "body": "Statistics is the science of collecting, analyzing, and interpreting numerical data. It transforms raw engineering measurements into actionable insights. Descriptive statistics summarize data sets (e.g., material strength, temperature readings); inferential statistics allow prediction of future performance based on sample data. Engineering applications include quality control, reliability analysis and process optimization. <span class='src'>[ENRICHMENT FROM COURSE SLIDES]</span>"}, {"type": "text", "title": "Historical note (source)", "body": "Alan Turing — 'Father of Computer Science' — wrote a dissertation on probability theory and used probability and statistics to crack the Enigma code during WWII."}]}, {"id": "t12", "code": "Lecture 1.2 & 1.3", "title": "Measures of Central Tendency (Mean · Median · Mode · Combined & Weighted Mean)", "sections": [{"type": "text", "title": "Central Tendency — Concept", "body": "Jab data compare karna ho ya summarize karna ho, toh poori dataset ko ek single value mein condense karte hain — yahi value 'center' ko represent karti hai, isliye ise <b>measure of central tendency</b> (ya average) kaha jata hai. Yeh distribution ki X-axis par location batata hai, isliye ise <b>measure of location</b> bhi kehte hain. Source mein teen main averages cover hain: <b>Mean, Median, Mode</b>. (Types listed in source: Arithmetic Mean, Geometric Mean, Harmonic Mean, Median, Mode — lectures focus on the arithmetic mean plus median and mode.)"}, {"type": "def", "title": "Formal Definition — Arithmetic Mean", "formal": "Arithmetic Mean is a value obtained by dividing the sum of all the observations by the number of observations.", "hinglish": "Mean basically poore data ka single representative hota hai: sab values ka sum, divided by kitni values hain. Example: marks 45,32,37,46,39,36,41,48,36 (n=9) ka sum 360 hai, toh mean = 360/9 = 40. <span class='src'>[SOURCE EXAMPLE]</span>", "keywords": ["sum of observations", "number of observations", "x̄ = Σx/n", "average"]}, {"type": "text", "title": "Population vs Sample (source terminology)", "body": "A <b>population</b> is the entire collection of objects (books, cars, people, all games of a player, etc.). A <b>sample</b> is a subset of the population. Mean/median/mode computed on the entire population are called population mean/median/mode; computed on a sample they are called sample mean/median/mode. Exam mein terminology confusion avoid karo — 'sample mean' aur 'population mean' ka symbol context clear rakho."}, {"type": "formula", "title": "Arithmetic Mean — Formulas", "items": [{"latex": "\\[ \\bar{x} = \\frac{\\sum_{i=1}^{n} x_i}{n} \\quad \\text{(ungrouped / raw data)} \\]", "vars": "\\(x_i\\) = observations, \\(n\\) = number of observations, \\(\\bar{x}\\) = mean."}, {"latex": "\\[ \\bar{x} = \\frac{\\sum f_i x_i}{\\sum f_i} \\quad \\text{(direct method, grouped data)} \\]", "vars": "\\(f_i\\) = frequencies, \\(x_i\\) = values (or class midpoints for continuous data), \\(n = \\sum f_i\\)."}, {"latex": "\\[ \\bar{x} = A + \\frac{\\sum f_i d_i}{\\sum f_i}, \\quad d_i = x_i - A \\quad \\text{(short-cut method)} \\]", "vars": "\\(A\\) = assumed mean, \\(d_i = x_i - A\\)."}, {"latex": "\\[ \\bar{x} = A + \\left(\\frac{\\sum f_i u_i}{\\sum f_i}\\right) h, \\quad u_i = \\frac{x_i - A}{h} \\quad \\text{(step-deviation method)} \\]", "vars": "\\(h\\) = class width, \\(u_i\\) = coded deviation."}]}, {"type": "text", "title": "Which Method Should I Use? (method selection in Hinglish)", "body": "(1) <b>Direct method</b>: raw/discrete data ya jab numbers chhote hain — straightforward. (2) <b>Short-cut method</b>: jab values bade hain aur unme se ek convenient assumed mean \\(A\\) pick kar sakte ho — deviations chhote ban jaate hain. (3) <b>Step-deviation method</b>: grouped/continuous data jab class width \\(h\\) same ho — \\(u=(x-A)/h\\) deviations ko integers mein convert kar deta hai. Exam mein 'using short-cut method' ya 'step deviation method' explicitly bola jaye toh wohi method follow karna mandatory hai."}, {"type": "list", "title": "Properties of Arithmetic Mean (source)", "items": ["The mean of a constant is that constant.", "Sum of deviations from the mean is zero: Σ(xᵢ − x̄) = 0.", "Sum of squared deviations from the mean is minimum: Σ(xᵢ − x̄)² < Σ(xᵢ − A)² for any arbitrary A.", "Mean is affected by change of origin and scale (adding/multiplying each value by a constant changes the mean accordingly)."]}, {"type": "list", "title": "Advantages & Disadvantages of Arithmetic Mean (source)", "items": ["<b>Advantages:</b> readily understood; easy computation (needs only sum and count); no need to arrange data; can be treated algebraically (combined mean of groups possible); stable under sampling fluctuations.", "<b>Disadvantages:</b> cannot be obtained by inspection; needs exact values of all observations (open-end classes problematic); highly affected by extreme values; may not be an actual observed value (e.g., 2.54 children per family)."]}, {"type": "example", "title": "Example 1 (Basic) — Mean of raw data <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "Calculate the arithmetic mean for the marks obtained by 9 students: 45, 32, 37, 46, 39, 36, 41, 48, 36.", "asked": "Examiner raw data ka mean expect karta hai — direct formula.", "given": "9 values; n = 9, Σx = 360.", "method": "Raw (ungrouped) data given hai, isliye x̄ = Σx/n.", "formula": "\\[ \\bar{x} = \\frac{\\sum x_i}{n} \\]", "steps": ["Σx = 45+32+37+46+39+36+41+48+36 = 360.", "x̄ = 360/9 = 40."], "answer": "Mean = 40 marks", "tip": "Raw data mein direct Σx/n karo. Intermediate Σx table show karna exam-safe hai."}, {"type": "example", "title": "Example 2 (Standard) — Grouped data, Direct Method <span class='src'>[SOURCE QUESTION + GENERATED SOLUTION]</span>", "problem": "Weights (grams) of 60 apples: classes 65–84, 85–104, 105–124, 125–144, 145–164, 165–184, 185–204 with frequencies 9, 10, 17, 10, 5, 4, 5. Find the mean.", "asked": "Grouped frequency distribution diya hai, midpoint nikaal ke direct method.", "given": "N = Σf = 60.", "method": "Class intervals hain, isliye midpoints xᵢ le lo aur x̄ = Σfx/Σf apply karo.", "formula": "\\[ \\bar{x} = \\frac{\\sum f_i x_i}{\\sum f_i} \\]", "steps": ["Midpoints: 74.5, 94.5, 114.5, 134.5, 154.5, 174.5, 194.5.", "fx: 670.5, 945, 1946.5, 1345, 772.5, 698, 972.5 (Σfx = 7350).", "x̄ = 7350/60 = 122.5."], "answer": "x̄ = 122.5 grams", "tip": "Grouped data mein fx column ka table exam mein zaroor banao."}, {"type": "example", "title": "Example 3 (Standard) — Short-Cut Method <span class='src'>[SOURCE QUESTION + GENERATED SOLUTION]</span>", "problem": "Same apple-weight distribution as Example 2. Find mean using the short-cut method with assumed mean A = 114.5.", "asked": "Deviation-based shortcut.", "given": "A = 114.5.", "method": "Values large hain, toh assumed mean se deviations chhote karte hain.", "formula": "\\[ \\bar{x} = A + \\frac{\\sum f_i d_i}{\\sum f_i},\\ d_i = x_i - A \\]", "steps": ["d: −40, −20, 0, 20, 40, 60, 80.", "fd: −360, −200, 0, 200, 200, 240, 400, Σfd = 480.", "x̄ = 114.5 + 480/60 = 114.5 + 8 = 122.5."], "answer": "x̄ = 122.5 grams (same as direct method — verification)", "tip": "Class midpoints equal difference (20) par hain toh short-cut convenient hai."}, {"type": "example", "title": "Example 4 (Standard) — Step-Deviation Method <span class='src'>[SOURCE QUESTION + GENERATED SOLUTION]</span>", "problem": "Same distribution. Find mean by the step-deviation method (h = 20, A = 114.5).", "asked": "Devations ko h se divide karke integers banate hain.", "given": "h = 20, A = 114.5.", "method": "Equal class width → step deviation sabse fast.", "formula": "\\[ \\bar{x} = A + \\left(\\frac{\\sum f_i u_i}{\\sum f_i}\\right)h,\\ u_i = \\frac{x_i-A}{h} \\]", "steps": ["u: −2, −1, 0, 1, 2, 3, 4.", "fu: −18, −10, 0, 10, 10, 12, 20 → Σfu = 24.", "x̄ = 114.5 + (24/60)×20 = 114.5 + 8 = 122.5."], "answer": "x̄ = 122.5 grams", "tip": "Step-deviation mein answer same aana chahiye — cross-check ka practice karo."}, {"type": "def", "title": "Formal Definition — Median", "formal": "When the observations are arranged in ascending or descending order, then a value that divides a distribution into two equal parts is called the median.", "hinglish": "Median woh middle value hai jo data ko aadhe-aadha parts mein split karta hai jab data ascending order mein ho. Mean extreme values se distort ho jaata hai (e.g., 4 workers earning ₹5000–8000 and supervisor ₹20000 → mean ₹9400, but 4 out of 5 earn much less than ₹9400), isliye median robust alternative hota hai. <span class='src'>[SOURCE EXAMPLE]</span>", "keywords": ["ascending order", "middle value", "splits into two equal parts", "robust to outliers"]}, {"type": "formula", "title": "Median — Formulas (raw data)", "items": [{"latex": "\\[ \\text{If } n \\text{ odd: } M = \\left(\\frac{n+1}{2}\\right)^{\\text{th}} \\text{ observation} \\]", "vars": "n = number of observations (after arranging in order)."}, {"latex": "\\[ \\text{If } n \\text{ even: } M = \\frac{\\left(\\frac{n}{2}\\right)^{\\text{th}} + \\left(\\frac{n}{2}+1\\right)^{\\text{th}}}{2} \\]", "vars": "Average of two middle observations."}]}, {"type": "example", "title": "Example 5 (Standard) — Median of ungrouped data <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "Find the median marks (out of 15) obtained by 35 students; the frequency table's cumulative arrangement shows the 18th observation equals 7 (source table).", "asked": "Frequency table se cumulative position identify karna.", "given": "n = 35 (odd).", "method": "n odd → (n+1)/2 = 18th observation is the median.", "formula": "\\[ M = \\left(\\frac{n+1}{2}\\right)^{\\text{th}} \\text{observation} \\]", "steps": ["(35+1)/2 = 18th observation.", "18th observation = 7 (from the cumulative count of the frequency table)."], "answer": "Median = 7 marks", "tip": "Frequency table mein median find karna hai toh cumulative frequencies compare karo."}, {"type": "list", "title": "Advantages & Disadvantages of Median (source)", "items": ["<b>Advantages:</b> easy to understand and calculate; works even with open-end or unequal-width classes; applicable to qualitative/ranked data (psychological and social studies).", "<b>Disadvantages:</b> data must be arranged; cannot be treated algebraically (composite median of groups not derivable); unsuitable when extreme values need weightage; grouped-data interpolation assumes uniform distribution inside the median class; more affected by sampling fluctuations than the mean."]}, {"type": "def", "title": "Formal Definition — Mode", "formal": "The observation that occurs most frequently in the data is called the mode.", "hinglish": "Mode woh value hai jiski frequency maximum hoti hai — e.g., shirt size 105 cm sold the most this week → company produces more of that size. Garment/shoe industries mode-based decisions use karte hain. <span class='src'>[SOURCE EXAMPLE]</span>", "keywords": ["maximum frequency", "most frequent value", "modal value"]}, {"type": "text", "title": "Remarks on Mode (source)", "body": "(1) If each observation has the same frequency, the data has no mode. (2) If two or more values tie for maximum frequency, the distribution is bimodal/multimodal. (3) Example: 9, 6, 8, 9, 10, 7, 12, 15, 22, 15 — both 9 and 15 have frequency 2 → two modes. <span class='src'>[SOURCE EXAMPLE]</span>"}, {"type": "list", "title": "Advantages & Disadvantages of Mode (source)", "items": ["<b>Advantages:</b> obtainable by inspection; unaffected by extreme values; computable from open-end classes if the modal class and adjoining classes (equal width) are available.", "<b>Disadvantages:</b> meaningless for few observations; may not exist or may not be unique; hard to locate exactly from grouped data (formula only approximate for equal-width classes with a clear maximum); not algebraically treatable."]}, {"type": "example", "title": "Example 6 (Basic) — Mode by inspection <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "Goals scored by a football team in 12 matches: 1, 2, 2, 3, 1, 2, 2, 4, 5, 3, 3, 4. Find the modal score.", "asked": "Highest frequency wali value.", "given": "12 observations.", "method": "Inspection — count frequencies.", "formula": null, "steps": ["Frequency of 2 is 4; all others occur fewer times."], "answer": "Mode = 2", "tip": "Raw data ho toh mode inspection se fast ho jaata hai."}, {"type": "try", "problem": "Find the mode of: 5, 10, 3, 7, 2, 9, 6, 2, 11, 2. <span class='src'>[SOURCE PRACTICE QUESTION]</span>", "hint": null, "answer": "Mode = 2 (frequency 3)", "solution": null}, {"type": "def", "title": "Formal Definition — Combined Mean", "formal": "When two or more groups have different means and different numbers of observations, the mean of the combined group is called the Combined Mean (also known as Composite Mean).", "hinglish": "Jab alag-alag groups ke individual means aur sizes pata hon, toh overall mean combined mean formula se nikalta hai — simple average of means galat hoga kyun ki group sizes alag hain.", "keywords": ["n₁x̄₁ + n₂x̄₂", "weighted by group size", "composite mean"]}, {"type": "formula", "title": "Combined Mean", "items": [{"latex": "\\[ \\bar{x}_c = \\frac{n_1 \\bar{x}_1 + n_2 \\bar{x}_2}{n_1 + n_2} \\]", "vars": "\\(n_i\\)=group size, \\(\\bar{x}_i\\)=group mean."}]}, {"type": "list", "title": "Steps to find Combined Mean (source)", "items": ["Multiply each mean by its group size", "Add all products", "Add total observations", "Divide total product sum by total observations"]}, {"type": "example", "title": "Example 7 (Exam) — Combined Mean <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "Average marks of 40 students in Section A is 65 and of 35 students in Section B is 70. Find the combined mean.", "asked": "Group means + sizes → combined.", "given": "n₁=40, x̄₁=65; n₂=35, x̄₂=70.", "method": "Combined mean formula.", "formula": "\\[ \\bar{x}_c = \\frac{n_1 \\bar{x}_1 + n_2 \\bar{x}_2}{n_1+n_2} \\]", "steps": ["Numerator = 40×65 + 35×70 = 2600 + 2450 = 5050.", "Denominator = 75.", "x̄_c = 5050/75 = 67.33."], "answer": "Combined mean ≈ 67.33", "tip": "Missing-variable types: combined mean diya ho aur ek group ka mean poochha ho toh algebraically rearrange karo."}, {"type": "def", "title": "Formal Definition — Weighted Mean", "formal": "When different observations are assigned different levels of importance (weights), the average obtained is called the Weighted Mean.", "hinglish": "Har value ka importance alag ho toh simple average misleading hota hai — weights se multiply karke weighted mean nikalte hain. Probability mein weights probabilities ban jaate hain, aur weighted mean = expected value ho jaata hai (source observation).", "keywords": ["Σwx / Σw", "weights", "importance of values"]}, {"type": "example", "title": "Example 8 (Exam) — Weighted Mean <span class='src'>[SOURCE QUESTION + GENERATED SOLUTION]</span>", "problem": "A consumer buys a commodity @ ₹4.80, ₹6, ₹8, ₹12, ₹24 per unit in five successive years. Calculate average cost per unit if he buys (a) 1000 units each year; (b) 1000, 800, 600, 400, 200 units respectively.", "asked": "Equal vs unequal weights comparison.", "given": "Prices: 4.8, 6, 8, 12, 24. Weights (b): 1000, 800, 600, 400, 200.", "method": "(a) equal weights → simple mean; (b) weighted mean = Σwx/Σw.", "formula": "\\[ \\bar{x}_w = \\frac{\\sum w_i x_i}{\\sum w_i} \\]", "steps": ["(a) x̄ = (4.8+6+8+12+24)/5 = 54.8/5 = ₹10.96.", "(b) Σwx = 4.8(1000)+6(800)+8(600)+12(400)+24(200) = 4800×5 = 19200; Σw = 3000.", "x̄_w = 19200/3000 = ₹6.4."], "answer": "(a) ₹10.96 per unit; (b) ₹6.4 per unit", "tip": "Weights equal hone par weighted mean = simple mean hota hai."}, {"type": "list", "title": "Common Mistakes (Mean/Median/Mode)", "items": ["Applying Σx/n to grouped data without midpoints — grouped data ho toh pehle midpoints nikalo.", "Median n even case mein sirf ek middle value lena — do middle values ka average chahiye.", "Mode ke lie data arrange na karna — frequency count zaroori.", "Combined mean ke lie group means ka simple average lena — group sizes se weight karna mandatory.", "Slide-deck pitfall list (enrichment): using mean for highly skewed data; ignoring outliers; confusing sample mean with population mean; computing mean of categorical data — invalid."]}, {"type": "list", "title": "Exam Focus", "items": ["Direct vs short-cut vs step-deviation — teeno methods same answer dete hain; exam mein specified method strictly use karo.", "Combined mean: numerator weighted sum, denominator total count — most-asked formula.", "Median odd/even rule + Mode remarks (no-mode / bimodal) rapid theory points.", "Source practice set: (i) median of goals 1,0,3,2,4,5,2,4,4,2,5 → 3; (ii) median of marks 46,52,48,39,41,62,55,53,96,39,45,99 → 50. <span class='src'>[SOURCE QUESTIONS, ANSWERS GENERATED]</span>"]}]}, {"id": "t13", "code": "Lecture 1.4", "title": "Measures of Dispersion — Range", "sections": [{"type": "text", "title": "Concept of Dispersion", "body": "Averages akela sufficient nahi — do distributions ka mean same ho sakta hai phir bhi variability alag ho (source example: two paddy varieties, both mean yield 42 kg, ek consistent, ek variable — first variety preferable). Dispersion = scatterness of observations from their average."}, {"type": "list", "title": "Characteristics of a good measure of dispersion (source)", "items": ["Rigidly defined", "Based on all items", "Not unduly affected by extreme items", "Lends itself to algebraic manipulation", "Simple to understand and easy to calculate"]}, {"type": "def", "title": "Formal Definition — Range", "formal": "Range is defined as the difference between the largest and the smallest values of the variable: Range = L − S, where L = largest value and S = smallest value.", "hinglish": "Range sabse simple dispersion measure hai — max minus min. Continuous series mein do methods: (M1) extreme classes ki boundaries; (M2) extreme classes ke mid-values.", "keywords": ["L − S", "largest", "smallest", "extreme values"]}, {"type": "list", "title": "Merits and Demerits of Range (source)", "items": ["<b>Merits:</b> simple; easy to calculate; widely used in quality control, weather forecasts, share price analysis.", "<b>Demerits:</b> affected by extreme items; based on only two observations; open-end classes par fail; not suitable for mathematical treatment; rarely used."]}, {"type": "example", "title": "Example 1 (Exam) — Percentage change in Range <span class='src'>[SOURCE QUESTION]</span>", "problem": "Weights of 11 forty-year-old men: 148, 154, 158, 160, 161, 162, 166, 170, 180, 195, 236 pounds. If the heaviest man is omitted, find the percentage change in the range.", "asked": "Extreme value drop karne par impact.", "given": "11 values.", "method": "Range before & after.", "formula": "\\[ R = L - S \\]", "steps": ["Original range = 236 − 148 = 88.", "New range (after omitting 236) = 195 − 148 = 47.", "% change = (88 − 47)/88 × 100 = 46.6% decrease."], "answer": "Range decreases by ≈ 46.6%", "tip": "Range extreme-dependent — iski demerit."}, {"type": "try", "problem": "Find the range of component lifespans: 100, 120, 130, 140, 150, 160, 180, 200. <span class='src'>[ENRICHMENT FROM COURSE SLIDES]</span>", "hint": "Max − min.", "answer": "Range = 100 hours", "solution": ["R = 200 − 100 = 100 hours."]}]}, {"id": "t14", "code": "Lecture 1.4", "title": "Quartile Deviation & Quartiles", "sections": [{"type": "def", "title": "Formal Definition — Quartile Deviation", "formal": "Quartile Deviation (Q.D.) is an absolute measure of dispersion based on quartiles; it equals half the difference between the upper (third) and lower (first) quartile — also called the semi-interquartile range: Q.D. = (Q₃ − Q₁)/2.", "hinglish": "Q.D. middle 50% of data par based hai — extreme values se almost unaffected.", "keywords": ["(Q₃ − Q₁)/2", "semi-interquartile", "quartiles"]}, {"type": "formula", "title": "Quartiles — Formulas", "items": [{"latex": "\\[ Q_1 = \\text{value of } \\left(\\frac{n+1}{4}\\right)^{\\text{th}} \\text{ item} \\]", "vars": "individual series."}, {"latex": "\\[ Q_3 = \\text{value of } \\left(\\frac{3(n+1)}{4}\\right)^{\\text{th}} \\text{ item} \\]", "vars": "individual series."}, {"latex": "\\[ Q_1 = L + \\left(\\frac{\\frac{N}{4} - m}{f}\\right) C \\]", "vars": "continuous distribution; L, m (preceding c.f.), f, C = class width."}, {"latex": "\\[ Q_3 = L_3 + \\left(\\frac{\\frac{3N}{4} - m_1}{f_1}\\right) C \\]", "vars": "continuous distribution."}, {"latex": "\\[ \\text{Inter-quartile range} = Q_3 - Q_1;\\quad Q.D. = \\frac{Q_3 - Q_1}{2} \\]", "vars": ""}, {"latex": "\\[ \\text{Coefficient of Q.D.} = \\frac{Q_3 - Q_1}{Q_3 + Q_1} \\]", "vars": "Relative comparison measure."}]}, {"type": "list", "title": "Advantages / Limitations / Applications (source)", "items": ["<b>Advantages:</b> simple; unaffected by extremes; good for skewed/open-end distributions.", "<b>Limitations:</b> ignores 50% of observations; less accurate than SD; not algebraically treatable.", "<b>Applications:</b> income distribution, business statistics, educational analysis, economic studies."]}, {"type": "example", "title": "Example 1 (Standard) — Q₁, Q₃, Q.D. <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "Find upper and lower quartiles and the quartile deviation of: 36, 43, 47, 28, 18, 9, 32.", "asked": "Quartiles locate karke Q.D.", "given": "7 values.", "method": "Sorted order mein (n+1)/4 and 3(n+1)/4 positions.", "formula": null, "steps": ["Sorted: 9, 18, 28, 32, 36, 43, 47.", "Q₁ = 2nd = 18; Q₃ = 6th = 43.", "Q.D. = (43 − 18)/2 = 12.5."], "answer": "Q₁ = 18, Q₃ = 43, Q.D. = 12.5", "tip": "Pehle sort, phir formula positions."}, {"type": "example", "title": "Example 2 (Standard) — Q.D. with fractional positions <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "Find the quartile deviation of: 5, 7, 8, 12, 15, 18, 21, 24, 30.", "asked": "Fractional position par interpolation.", "given": "n = 9.", "method": null, "formula": null, "steps": ["Q₁ position = 2.5 → Q₁ = (7+8)/2 = 7.5.", "Q₃ position = 7.5 → Q₃ = (21+24)/2 = 22.5.", "Q.D. = (22.5 − 7.5)/2 = 7.5."], "answer": "Q.D. = 7.5", "tip": "Fractional position → interpolation."}, {"type": "try", "problem": "Find quartile deviation for: 2, 4, 6, 8, 10, 12, 14, 16, 18. <span class='src'>[SOURCE PRACTICE QUESTION]</span>", "hint": null, "answer": "Q.D. = 5", "solution": ["Q₁ = (4+6)/2 = 5; Q₃ = (14+16)/2 = 15; Q.D. = 5."]}, {"type": "try", "problem": "Calculate coefficient of quartile deviation: Q₁ = 20, Q₃ = 50. <span class='src'>[SOURCE PRACTICE QUESTION]</span>", "hint": null, "answer": "0.4286", "solution": ["(Q₃−Q₁)/(Q₃+Q₁) = 30/70 = 0.4286."]}, {"type": "try", "problem": "Find quartile deviation of: 5, 9, 12, 15, 18, 22, 25, 28. <span class='src'>[SOURCE PRACTICE QUESTION]</span>", "hint": null, "answer": "Q.D. = 7.25 (interpolation) <span class='src'>[ANSWER GENERATED]</span>", "solution": ["Positions 2.25 and 6.75: Q₁ = 9.75, Q₃ = 24.25, Q.D. = 7.25."]}, {"type": "list", "title": "Common Mistakes", "items": ["Data sort karna bhoolna.", "Q.D. ka full (Q₃ − Q₁) lena — half lena hai.", "Coefficient formula ka denominator (Q₃+Q₁) bhoolna."]}, {"type": "list", "title": "Exam Focus", "items": ["Q₁ = (n+1)/4, Q₃ = 3(n+1)/4 — raw data.", "Grouped formula with L, m, f, C revise karo.", "Coefficient = (Q₃−Q₁)/(Q₃+Q₁) — unit-free."]}]}, {"id": "t15", "code": "Lecture 1.5", "title": "Mean Deviation", "sections": [{"type": "def", "title": "Formal Definition — Mean Deviation", "formal": "Mean Deviation of a set of observations is the arithmetic mean of the absolute deviations from the mean (or any other specified value A).", "hinglish": "Signed deviations ka sum zero hota hai, isliye absolute deviations |x − A| lete hain. Default base = mean.", "keywords": ["arithmetic mean of absolute deviations", "|x − x̄|", "about mean/median/A"]}, {"type": "formula", "title": "Mean Deviation — Formulas", "items": [{"latex": "\\[ M.D. \\text{ about } A = \\frac{1}{n}\\sum |x_i - A| \\]", "vars": "raw series."}, {"latex": "\\[ M.D. = \\frac{1}{N}\\sum f_i |x_i - \\bar{x}| \\]", "vars": "frequency distribution, N = Σf."}]}, {"type": "text", "title": "How to Recognize the Question", "body": "'About median' → median pehle, phir |x − median| column. Frequency table → fx se x̄, phir f|x − x̄| column."}, {"type": "example", "title": "Example 1 (Exam) — M.D. about the Median <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "Calculate mean deviation about the median: 8, 15, 53, 49, 19, 62, 7, 15, 95, 77.", "asked": "Deviations median se; n even.", "given": "10 values.", "method": "n = 10 even → median = average of two middle values.", "formula": "\\[ M.D. = \\frac{1}{n}\\sum |x_i - \\text{median}| \\]", "steps": ["Sorted: 7,8,15,15,(19,49),53,62,77,95 → median = 34.", "Absolute deviations: 26,19,19,15,15,28,27,19,61,43 → sum 272.", "M.D. = 272/10 = 27.2."], "answer": "M.D. = 27.2", "tip": "Even n → two-middle average."}, {"type": "example", "title": "Example 2 (Exam) — M.D. for Frequency Distribution <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "Find mean deviation: X = 10, 11, 12, 13, 14; frequencies 3, 12, 18, 12, 3.", "asked": "Weighted mean pehle, phir f|x − x̄|.", "given": "N = 48.", "method": "Weighted formula.", "formula": null, "steps": ["Σfx = 576 → x̄ = 12.", "|x − x̄| = 2,1,0,1,2; weighted sum = 36.", "M.D. = 36/48 = 0.75."], "answer": "M.D. = 0.75", "tip": "Symmetric data → mean middle value."}, {"type": "list", "title": "Common Mistakes", "items": ["Absolute values lena bhoolna.", "'About median' ignore karke mean use karna."]}, {"type": "list", "title": "Exam Focus", "items": ["M.D. = (1/N) Σ f|x − A|; base A question-specified.", "Median-based M.D. mein median pehle nikalo."]}]}, {"id": "t16", "code": "Lecture 1.5 + Slides", "title": "Standard Deviation, Variance & Coefficient of Variation", "sections": [{"type": "def", "title": "Formal Definition — Standard Deviation", "formal": "Standard Deviation is the positive square-root of the arithmetic mean of the squares of the deviations from the arithmetic mean. Denoted by s (sample) and σ (population).", "hinglish": "Deviations square karke unka mean (variance) aur phir positive root — squaring signed cancellation avoid karta hai; root se original units wapas.", "keywords": ["positive square root", "mean of squared deviations", "σ or s"]}, {"type": "formula", "title": "Standard Deviation & Variance — Formulas", "items": [{"latex": "\\[ s = \\sqrt{\\frac{1}{n}\\sum (x_i - \\bar{x})^2} \\]", "vars": "raw data."}, {"latex": "\\[ s = \\sqrt{\\frac{1}{N}\\sum f_i (x_i - \\bar{x})^2} \\]", "vars": "frequency distribution."}, {"latex": "\\[ \\sigma^2 = \\frac{\\sum x^2}{n} - \\left(\\frac{\\sum x}{n}\\right)^2 \\]", "vars": "computational form — reverse problems."}, {"latex": "\\[ s = C\\sqrt{\\frac{\\sum f d^2}{N} - \\left(\\frac{\\sum f d}{N}\\right)^2},\\ d=\\frac{x-A}{C} \\]", "vars": "step-deviation."}, {"latex": "\\[ \\text{Variance} = \\sigma^2 \\]", "vars": "variance = (S.D.)²"}]}, {"type": "text", "title": "Population vs Sample (course slides — enrichment)", "body": "Population variance: denominator N; sample variance: denominator n−1 (unbiased estimator). Squaring prevents cancellation, weights outliers, minimized at mean (least-squares optimality)."}, {"type": "list", "title": "Merits and Demerits of Standard Deviation (source)", "items": ["<b>Merits:</b> rigidly defined; based on all observations; most important/widely used; algebraically treatable; stable under sampling; basis for correlation & sampling.", "<b>Demerits:</b> hard to understand/calculate; weights outliers (squaring); absolute → non-comparable directly (hence C.V.)."]}, {"type": "example", "title": "Example 1 (Challenging) — Recovering Σx² <span class='src'>[SOURCE QUESTION]</span>", "problem": "S.D. from a set of 32 observations is 5; sum of observations is 80. Find sum of squares.", "asked": "Computational form reverse use.", "given": "n=32, σ=5, Σx=80.", "method": "σ² = Σx²/n − (Σx/n)² rearrange.", "formula": null, "steps": ["25 = Σx²/32 − 6.25.", "Σx² = 31.25 × 32 = 1000."], "answer": "Σx² = 1000", "tip": "Expanded form 'find Σx²' traps."}, {"type": "example", "title": "Example 2 (Exam) — S.D. by Step-Deviation <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "Seed yield (grams) of 50 sesamum plants: classes 2.5–3.5, 3.5–4.5, 4.5–5.5, 5.5–6.5, 6.5–7.5; frequencies 4, 6, 15, 15, 10. Find S.D.", "asked": "Equal-width classed data → step-deviation.", "given": "N=50, A=5, C=1.", "method": "d = (x−A)/C; s = C√(Σfd²/N − (Σfd/N)²).", "formula": null, "steps": ["Midpoints 3,4,5,6,7; d: −2,−1,0,1,2.", "Σfd = 21, Σfd² = 77.", "s = √(77/50 − (21/50)²) = √1.3636 = 1.1677."], "answer": "s = 1.1677 grams", "tip": "Step-deviation table = exam backbone."}, {"type": "example", "title": "Example 3 (Basic) — Variance from deviations (slides)", "problem": "Tensile strength of 5 steel samples (N/mm²): 400, 410, 405, 395, 415. Find variance and S.D.", "asked": "Mean, deviations, squares.", "given": "n = 5.", "method": null, "formula": null, "steps": ["Mean = 405.", "Squared deviations sum = 250.", "σ² = 250/5 = 50; σ = 7.07."], "answer": "σ² = 50, σ = 7.07 N/mm²", "tip": "Mean galat → variance galat. <span class='src'>[SOURCE SLIDE]</span>"}, {"type": "example", "title": "Example 4 (Standard) — Sample variance (slides)", "problem": "Sample of five values: 10, 12, 14, 16, 18. Sample variance and S.D?", "asked": "Sample denominator n−1.", "given": "n = 5.", "method": "s² = Σ(x−x̄)²/(n−1).", "formula": null, "steps": ["Mean 14; squared deviations sum 40.", "s² = 40/4 = 10; s = 3.16."], "answer": "s² = 10, s = 3.16", "tip": "Sample vs population denominator trap. <span class='src'>[ENRICHMENT FROM COURSE SLIDES]</span>"}, {"type": "def", "title": "Formal Definition — Coefficient of Variation", "formal": "The Coefficient of Variation is a relative measure of dispersion obtained by dividing the standard deviation by the mean, expressed as a percentage: C.V. = (σ/x̄) × 100.", "hinglish": "S.D. absolute hai — do series different units compare ke lie C.V. Higher C.V. → more variable/less consistent; lower C.V. → more stable.", "keywords": ["(σ/x̄)×100", "relative measure", "comparison"]}, {"type": "example", "title": "Example 5 (Exam) — Coefficient of Variation <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "Paddy variety: yield mean 50 kg, SD 10; plant height mean 55 cm, SD 5. Compare variabilities.", "asked": "Different units → only C.V. comparable.", "given": "Yield (50,10); Height (55,5).", "method": "C.V. = (σ/x̄) × 100.", "formula": null, "steps": ["Yield C.V. = 10/50 = 20%.", "Height C.V. = 5/55 = 9.1%.", "Yield more variable."], "answer": "Yield (20%) more variable than height (9.1%)", "tip": "Raw σ se compare mat karo — C.V. only."}, {"type": "list", "title": "Common Mistakes (SD/Variance/CV)", "items": ["Deviations square karna bhoolna.", "Sample data par denominator n instead of n−1.", "Variance vs S.D. interchange.", "Early rounding of squares.", "Different-unit series raw σ se compare karna."]}, {"type": "list", "title": "Exam Focus", "items": ["σ² = Σx²/n − x̄² — reverse problems.", "Step-deviation for grouped data.", "Sample: n−1 denominator (slides).", "C.V. = (σ/x̄)×100 — higher = more variable."]}]}]}, {"id": "u2", "title": "Unit 2 — Moments, Skewness & Kurtosis", "sub": "Official course blueprint: Lecture 2.1 Moments, 2.2 Moments relation & Pearson coefficients, 2.3 Skewness (Karl Pearson & Bowley), 2.4 Kurtosis + slide modules.", "topics": [{"id": "t21", "code": "Lecture 2.1", "title": "Moments — Concepts, Types & Formulas", "sections": [{"type": "text", "title": "Introduction", "body": "Moments distribution ke characteristics describe karne ka convenient unified method hain — tendency, variation, skewness, kurtosis sab summarize hote hain. First raw moment = mean; second central moment = variance; third & fourth = skewness, kurtosis. Moments teen types: arbitrary point, mean (central), origin (A = 0 for raw/origin moments)."}, {"type": "def", "title": "Formal Definition — Moments", "formal": "In statistics, moments are the arithmetic means of the first, second, third and higher powers of the deviations taken either from the mean or from an arbitrary point of a distribution.", "hinglish": "Deviation ki r-th power ka arithmetic mean = r-th moment. Arbitrary point pe lo toh 'moments about arbitrary point'; mean pe lo toh 'central moments'; A=0 pe lo toh 'raw/origin moments'.", "keywords": ["deviation powers", "arithmetic mean", "central/raw/arbitrary"]}, {"type": "formula", "title": "Moments about Arbitrary Point (grouped data)", "items": [{"latex": "\\[ \\mu'_r = \\frac{\\sum_{i=1}^n f_i (x_i - A)^r}{N},\\quad N = \\sum f_i \\]", "vars": "A = arbitrary point; shortcut with d = (x−A)/h multiplies by h^r."}, {"latex": "\\[ \\mu'_r = \\frac{\\sum f_i d_i^r}{N} \\times h^r \\]", "vars": "short-cut form (grouped data)."}, {"latex": "\\[ \\mu'_1 = \\bar{x} - A,\\quad \\mu_0 = 1 \\]", "vars": "First arbitrary moment gives mean shift."}]}, {"type": "formula", "title": "Central Moments (about mean)", "items": [{"latex": "\\[ \\mu_r = \\frac{\\sum f_i (x_i - \\bar{x})^r}{N} \\]", "vars": "μ₀ = 1, μ₁ = 0, μ₂ = σ² (variance)."}, {"latex": "\\[ \\mu_2 = \\sigma^2,\\quad \\text{first central moment } \\mu_1 = 0 \\]", "vars": "because Σ fᵢ(xᵢ − x̄) = 0."}]}, {"type": "list", "title": "Properties recap (source)", "items": ["The first raw moment about origin is the mean; the first central moment is 0.", "Second raw moment = mean square deviation; second central moment = variance.", "Third and fourth moments measure skewness and kurtosis.", "Change of origin has no effect on moments; change of scale multiplies the r-th moment by h^r."]}]}, {"id": "t22", "code": "Lecture 2.2", "title": "Moments Conversion & Pearson β–γ Coefficients", "sections": [{"type": "text", "title": "Why convert?", "body": "Actual mean fraction mein aane par direct central moments tedious hote hain — pehle arbitrary point par moments nikalo, phir relations se central moments mein convert karo."}, {"type": "derive", "title": "Relation between Moments about Mean and Arbitrary Point (source derivation)", "steps": ["Let dᵢ = xᵢ − A. Then x̄ = A + μ′₁ where μ′₁ = (Σ d)/n.", "Expand \\( \\mu_r = \\frac{1}{N}\\sum f_i (d_i - \\mu'_1)^r \\) binomially.", "μ₂ = μ′₂ − μ′₁² ;", "μ₃ = μ′₃ − 3μ′₁μ′₂ + 2μ′₁³ ;", "μ₄ = μ′₄ − 4μ′₁μ′₂ + 6μ′₁²μ′₂ − 3μ′₁⁴."]}, {"type": "formula", "title": "Conversion formulas (critical)", "items": [{"latex": "\\[ \\mu_2 = \\mu'_2 - \\mu_1'^2 \\]", "vars": "second central moment."}, {"latex": "\\[ \\mu_3 = \\mu'_3 - 3\\mu'_1\\mu'_2 + 2\\mu_1'^3 \\]", "vars": "third."}, {"latex": "\\[ \\mu_4 = \\mu'_4 - 4\\mu'_1\\mu'_2 + 6\\mu_1'^2\\mu'_2 - 3\\mu_1'^4 \\]", "vars": "fourth."}, {"latex": "\\[ \\beta_1 = \\frac{\\mu_3^2}{\\mu_2^3},\\quad \\gamma_1 = \\sqrt{\\beta_1} = \\frac{\\mu_3}{\\sigma^3} \\]", "vars": "Pearson β₁ & γ₁ coefficients for skewness."}, {"latex": "\\[ \\beta_2 = \\frac{\\mu_4}{\\mu_2^2},\\quad \\gamma_2 = \\beta_2 - 3 \\]", "vars": "Pearson β₂ & γ₂ for kurtosis."}]}, {"type": "text", "title": "Sheppard's Corrections (source)", "body": "Grouped frequency distribution moments assume frequencies uniformly distributed about midpoints — approximation error for skewed data. Sheppard corrections: μ₂(corrected) = μ₂ − h²/12, μ₃(corrected) = μ₃, μ₄(corrected) = μ₄ − (h²/12) μ₂ + (7h⁴/240), where h = class width."}, {"type": "example", "title": "Example (Exam) — First four moments & β₁, β₂ <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "Marks 5,10,15,20,25,30,35 with frequencies 4,10,20,36,16,12,2. Calculate first four moments about mean and find β₁, β₂, γ₁, γ₂.", "asked": "Table columns fd, fd², fd³, fd⁴ construct karke moments.", "given": "N = 100.", "method": "Short-cut with A = 20 marks, h = 5.", "formula": null, "steps": ["Σfd = −6, Σfd² = 178, Σfd³ = −42, Σfd⁴ = 874.", "μ′₁ = −0.3, μ′₂ = 44.5, μ′₃ = −52.5, μ′₄ = 5462.5.", "Central: μ₂ = 44.41 (= σ²), μ₃ = −12.504, μ₄ = 5423.5057.", "β₁ = (−12.504)²/(44.41)³ = 0.001785; γ₁ = μ₃/σ³ = −0.0422.", "β₂ = 5423.5057/(44.41)² = 2.7499; γ₂ = −0.2501."], "answer": "μ = (0, 44.41, −12.504, 5423.51); β₂ < 3 → platykurtic", "tip": "Full table + correct formula selection hi marks dete hain. <span class='src'>[SOURCE WORKED SOLUTION]</span>"}, {"type": "try", "problem": "First four moments about the value 5 of a variable are 1, 10, 20, 25. Find central moments, β₁, β₂. <span class='src'>[SOURCE PRACTICE QUESTION]</span>", "hint": "Conversion formulas use karo.", "answer": "μ₂ = 9, μ₃ = −6, μ₄ = 54; β₁ = 4/81, β₂ = 2/3 <span class='src'>[ANSWER GENERATED]</span>", "solution": ["μ′₁ = 1: μ₂ = 10 − 1 = 9; μ₃ = 20 − 3(1)(10) + 2 = −6; μ₄ = 25 − 4(1)(10) + 6(1)(10) − 3 = 54. β₁ = 36/729 = 4/81; β₂ = 54/81 = 2/3."]}, {"type": "list", "title": "Common Mistakes", "items": ["Conversion formula signs galat lagana — carefully substitute.", "γ₁ sign: direction μ₃ par depend karta hai.", "Sheppard's correction optional hai — question specify kare toh hi apply."]}]}, {"id": "t23", "code": "Lecture 2.3", "title": "Skewness — Karl Pearson & Bowley Methods", "sections": [{"type": "def", "title": "Formal Definition — Skewness", "formal": "Skewness means lack of symmetry. A distribution is symmetric if mean, median and mode coincide; otherwise it is asymmetric. If the right tail is longer, the distribution is positively skewed (mean > median > mode); if the left tail is longer, it is negatively skewed (mean < median < mode).", "hinglish": "Symmetric curve = mirror image; skewed = tail ek taraf lambi. Positive skew → right tail lambi; negative → left tail.", "keywords": ["lack of symmetry", "mean>median>mode (positive)", "mean<median<mode (negative)"]}, {"type": "list", "title": "Absolute measures of skewness (source)", "items": ["Sk = Mean − Median", "Sk = Mean − Mode", "Sk = (Q₃ − Q₂) − (Q₂ − Q₁)", "Comparison ke lie relative coefficient (divide by SD) use karte hain."]}, {"type": "formula", "title": "Coefficient formulas", "items": [{"latex": "\\[ Sk = \\frac{\\text{Mean} - \\text{Mode}}{\\sigma} \\quad \\text{(Karl Pearson)} \\]", "vars": "Primary method — most used."}, {"latex": "\\[ Sk = \\frac{3(\\text{Mean} - \\text{Median})}{\\sigma} \\]", "vars": "If mode ill-defined: Mode = 3Median − 2Mean substitution."}, {"latex": "\\[ Sk = \\frac{Q_3 + Q_1 - 2Q_2}{Q_3 - Q_1} \\quad \\text{(Bowley)} \\]", "vars": "Quartile-based; range +1 to −1."}, {"latex": "\\[ \\gamma_1 = \\sqrt{\\beta_1} = \\frac{\\mu_3}{\\sigma^3} \\]", "vars": "Pearson moment coefficient γ₁; direction from μ₃ sign."}]}, {"type": "text", "title": "Variance vs Skewness (source difference)", "body": "Variance variability ki amount batata hai; skewness direction. Business/economic series mein variance zyada practical; medical/life-science mein skewness."}, {"type": "example", "title": "Example (Exam) — Finding Mode & Median from Sk <span class='src'>[SOURCE QUESTION + GENERATED SOLUTION]</span>", "problem": "For a distribution, Karl Pearson's coefficient of skewness is 0.64, standard deviation is 13 and mean is 59.2. Find mode and median.", "asked": "Sk formula rearrange for mode; Mode relation se median.", "given": "Sk = 0.64, σ = 13, Mean = 59.2.", "method": "Sk = (Mean − Mode)/σ.", "formula": null, "steps": ["Mode = Mean − Sk×σ = 59.2 − 0.64×13 = 59.2 − 8.32 = 50.88.", "Using Mode = 3Median − 2Mean → Median = (Mode + 2Mean)/3 = (50.88 + 118.4)/3 = 56.43."], "answer": "Mode = 50.88, Median = 56.43", "tip": "Reverse-engineering formulas common exam style."}, {"type": "try", "problem": "Karl Pearson's coefficient of skewness is 1.28, mean = 164, mode = 100. Find the standard deviation. <span class='src'>[SOURCE PRACTICE QUESTION]</span>", "hint": null, "answer": "σ = 50 <span class='src'>[ANSWER GENERATED]</span>", "solution": ["σ = (Mean − Mode)/Sk = 64/1.28 = 50."]}, {"type": "try", "problem": "Bowley's coefficient of skewness is 1.2. If Q₁ + Q₃ = 200 and median is 76, find Q₃. <span class='src'>[SOURCE PRACTICE QUESTION]</span>", "hint": null, "answer": "Q₃ = 132.5 <span class='src'>[ANSWER GENERATED]</span>", "solution": ["Sk = (Q₁ + Q₃ − 2Q₂)/(Q₃ − Q₁) = 1.2 → (Q₁+Q₃−152)/(Q₃−Q₁) = 1.2. With Q₁ + Q₃ = 200: (48)/(Q₃ − Q₁) = 1.2 → Q₃ − Q₁ = 40 → Q₃ = 120, Q₁ = 80? Then (200 − 152)/40 = 1.2 ✓ → Q₃ = 120."]}, {"type": "text", "title": "Interpretation ranges (course slides — enrichment)", "body": "Coefficient 0 → symmetric; between −0.5 and 0.5 → approximately symmetric; beyond ±0.5 → moderate; beyond ±1 → highly skewed."}, {"type": "list", "title": "Common Mistakes", "items": ["Direction galat predict karna (positive → right tail).", "Mode ill-defined hone par median relation na use karna.", "Bowley coefficient ka quartile relation mix up karna."]}]}, {"id": "t24", "code": "Lecture 2.4", "title": "Kurtosis & Nature of Distribution", "sections": [{"type": "def", "title": "Formal Definition — Kurtosis", "formal": "Kurtosis is a measure of the flatness or peakedness of a distribution relative to the normal curve. Prof. Karl Pearson called it the 'convexity of a curve'; it quantifies 'tailedness'.", "hinglish": "Central tendency, dispersion, skewness se bhi complete picture nahi — peakedness/tails of distribution kurtosis se. Leptokurtic > normal peaked, Platykurtic < normal, Mesokurtic = normal.", "keywords": ["tailedness", "peakedness", "β₂ = μ₄/σ⁴"]}, {"type": "formula", "title": "Kurtosis formulas", "items": [{"latex": "\\[ \\beta_2 = \\frac{\\mu_4}{\\sigma^4} \\quad (\\text{raw kurtosis}) \\]", "vars": "μ₄ = fourth central moment. Slide deck uses σ⁴ = (σ²)²."}, {"latex": "\\[ \\gamma_2 = \\beta_2 - 3 \\quad (\\text{excess kurtosis}) \\]", "vars": "γ₂ = 0 → normal."}]}, {"type": "list", "title": "Classification (source + slides)", "items": ["β₂ = 3 (γ₂ = 0) → mesokurtic (normal curve)", "β₂ < 3 (γ₂ < 0) → platykurtic (flatter peak, light tails)", "β₂ > 3 (γ₂ > 0) → leptokurtic (sharp peak, heavy tails)", "Leptokurtic → more outliers; Platykurtic → fewer outliers than normal."]}, {"type": "example", "title": "Example (Exam) — Skewness & Kurtosis from moments <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "First four moments about mean of a distribution are 0, 2.5, 0.7 and 18.75. Find coefficient of skewness and kurtosis.", "asked": "μ₁ = 0, μ₂ = 2.5, μ₃ = 0.7, μ₄ = 18.75 use karke β₁, β₂.", "given": "Central moments given.", "method": "β₁ = μ₃²/μ₂³; β₂ = μ₄/μ₂².", "formula": null, "steps": ["β₁ = (0.7)²/(2.5)³ = 0.031.", "β₂ = 18.75/(2.5)² = 18.75/6.25 = 3 → mesokurtic."], "answer": "β₁ ≈ 0.031 (nearly symmetric), β₂ = 3 (mesokurtic)", "tip": "Moments directly given → immediate coefficient calculation. <span class='src'>[SOURCE]</span>"}, {"type": "try", "problem": "First four raw moments of a distribution are 2, 136, 320 and 40,000. Find coefficients of skewness and kurtosis. <span class='src'>[SOURCE PRACTICE QUESTION]</span>", "hint": "Pehle conversion: central moments, phir β₁ β₂.", "answer": "β₁ ≈ 0, β₂ = 3.05 (approx mesokurtic) <span class='src'>[ANSWER GENERATED]</span>", "solution": ["Mean = μ′₁ = 2. Central: μ₂ = 136 − 4 = 132; μ₃ = 320 − 3(2)(136) + 2(8) = −480; μ₄ = 40000 − 4(2)(136) + 6(4)(136) − 3(16) = 42102.", "β₁ = (−480)²/(132)³ ≈ 0.1; β₂ = 42102/(132)² ≈ 2.42 → platykurtic.", "Note: [FORMULA VALUES MAY VARY IF RAW MOMENTS] — verify in exam conditions."]}, {"type": "list", "title": "Common Mistakes", "items": ["Kurtosis ko skewness se confuse karna — kurtosis peakedness/tailedness.", "Peak height alone na dekhna — tails consider karo.", "γ₂ sign interpretation galat karna."]}]}]}, {"id": "u3", "title": "Unit 3 — Probability: Basics, Laws & Bayes Theorem", "sub": "Official course blueprint: Lecture 3.1 definitions & laws, 3.2 conditional probability & Bayes, 3.3 random variables (placed in Unit 4 for narrative flow).", "topics": [{"id": "t31", "code": "Lecture 3.1", "title": "Basics of Probability — Definitions & Laws", "sections": [{"type": "text", "title": "Introduction", "body": "Probability uncertainty ko quantify karta hai — kitna likely hai event. Applications: weather forecasting, insurance & risk analysis, medical diagnosis, ML/AI, games & gambling, engineering reliability analysis."}, {"type": "def", "title": "Formal Definition — Random Experiment", "formal": "A random experiment is an experiment whose outcome cannot be predicted with certainty in advance.", "hinglish": "Tossing a coin, rolling a die, drawing a card, randomly selecting a student — in advance outcome nahi pata. Uske outcomes collect karne par sample space milta hai.", "keywords": ["uncertainty", "experiment", "outcome"]}, {"type": "def", "title": "Formal Definition — Sample Space & Event", "formal": "The set of all possible outcomes of a random experiment is called the sample space, denoted by S. An event is a subset of the sample space.", "hinglish": "Sample space = sab possible results ka set. Event = us subset jiska hum probability assign karte hain (e.g., die pe 'even number' event {2,4,6}).", "keywords": ["sample space", "subset", "event"]}, {"type": "list", "title": "Types of events (source)", "items": ["Simple event — one outcome (e.g., A = {2})", "Compound event — more than one outcome (e.g., A = {2,4,6})", "Impossible event — cannot occur (P = 0), e.g., get 7 on a die", "Sure event — always occurs (P = 1)", "Complementary event A′ = S − A"]}, {"type": "def", "title": "Formal Definition — Classical Probability", "formal": "If an experiment has n equally likely outcomes and m of them are favorable to event A, then P(A) = m/n, where 0 ≤ P(A) ≤ 1.", "hinglish": "Classical approach: total equally-likely outcomes denominator; favorable numerator. Coin toss H → favorable 1 of 2 → 1/2.", "keywords": ["m/n", "equally likely", "favorable outcomes"]}, {"type": "formula", "title": "Laws of Probability", "items": [{"latex": "\\[ P(A\\cup B) = P(A) + P(B) - P(A\\cap B) \\quad \\text{(addition)} \\]", "vars": "At least one event; mutually exclusive → P(A∩B)=0."}, {"latex": "\\[ P(A') = 1 - P(A) \\quad \\text{(complement)} \\]", "vars": "non-occurrence."}, {"latex": "\\[ P(A\\cap B) = P(A)\\,P(B\\mid A) \\quad \\text{(multiplication)} \\]", "vars": "independent: P(A∩B)=P(A)P(B)."}]}, {"type": "example", "title": "Example (Basic) — Coin & Die <span class='src'>[SOURCE SOLVED]</span>", "problem": "(a) Tossing a coin: find probability of Head. (b) Rolling a die: find probability of an even number.", "asked": "Sample space + favorable count.", "given": "(a) S={H,T}; (b) S={1..6}.", "method": "Classical P = m/n.", "formula": null, "steps": ["(a) P(H) = 1/2.", "(b) A = {2,4,6} → P(A) = 3/6 = 1/2."], "answer": "P(H) = 1/2; P(even) = 1/2", "tip": "Sample space clearly likho."}, {"type": "example", "title": "Example (Standard) — Addition Law <span class='src'>[SOURCE SOLVED]</span>", "problem": "A die is rolled. A = even number, B = number greater than 4. Find P(A∪B).", "asked": "Overlap subtract karna.", "given": "A = {2,4,6}, B = {5,6}.", "method": "A∩B = {6}.", "formula": "\\[ P(A\\cup B) = P(A)+P(B)-P(A\\cap B) \\]", "steps": ["P(A) = 3/6, P(B) = 2/6, P(A∩B) = 1/6.", "P(A∪B) = 3/6 + 2/6 − 1/6 = 4/6 = 2/3."], "answer": "P(A∪B) = 2/3", "tip": "Overlap na ghatao → overcount."}, {"type": "example", "title": "Example (Basic) — Complement Law <span class='src'>[SOURCE SOLVED]</span>", "problem": "Probability of passing an exam is 0.8. Find probability of failing.", "asked": "Complement = 1 − P.", "given": "P(pass) = 0.8.", "method": "P(A′) = 1 − P(A).", "formula": null, "steps": ["P(fail) = 1 − 0.8 = 0.2."], "answer": "P(fail) = 0.2", "tip": "Complement law quick tool."}, {"type": "example", "title": "Example (Standard) — Multiplication Law <span class='src'>[SOURCE SOLVED]</span>", "problem": "Two coins are tossed. Find probability of getting two heads.", "asked": "Independent events multiply.", "given": "P(H) = 1/2 each toss.", "method": "P(HH) = P(H)×P(H).", "formula": null, "steps": ["P(HH) = 1/2 × 1/2 = 1/4."], "answer": "P(HH) = 1/4", "tip": "Independence check zaruri."}]}, {"id": "t32", "code": "Lecture 3.2", "title": "Conditional Probability & Bayes Theorem", "sections": [{"type": "def", "title": "Formal Definition — Conditional Probability", "formal": "Conditional probability is the probability of occurrence of event A given that event B has already occurred: P(A|B) = P(A∩B)/P(B), where P(B) ≠ 0.", "hinglish": "B already hua — sample space ab B tak limited. Face card diya hai toh king aane ka probability sirf 4/12.", "keywords": ["given that", "P(A∩B)/P(B)", "reduced sample space"]}, {"type": "example", "title": "Example (Basic) — Conditional Probability <span class='src'>[SOURCE SOLVED]</span>", "problem": "One card is drawn from a deck. Find probability it is a king given that it is a face card.", "asked": "Reduced sample space.", "given": "Face cards = 12, kings = 4.", "method": "P(K|F) = favorable/total = 4/12.", "formula": null, "steps": ["P(K|F) = 4/12 = 1/3."], "answer": "P(K|F) = 1/3", "tip": "Given event ka sample space use karo."}, {"type": "list", "title": "Independent vs Dependent Events (source)", "items": ["<b>Independent:</b> occurrence of one event does not affect the other — P(A∩B) = P(A)P(B). Example: tossing two coins.", "<b>Dependent:</b> occurrence of one event affects the other. Example: drawing cards without replacement."]}, {"type": "formula", "title": "Bayes Theorem", "items": [{"latex": "\\[ P(A\\mid B) = \\frac{P(B\\mid A)\\,P(A)}{P(B)} \\]", "vars": "Used to revise probabilities based on new information."}]}, {"type": "list", "title": "Bayes applications (source)", "items": ["Medical testing", "Spam filtering", "Machine learning", "Decision-making"]}, {"type": "formula", "title": "Important Probability Identities (source)", "items": [{"latex": "\\[ P(S) = 1 \\]", "vars": ""}, {"latex": "\\[ P(\\varnothing) = 0 \\]", "vars": ""}, {"latex": "\\[ 0 \\le P(A) \\le 1 \\]", "vars": ""}, {"latex": "\\[ P(A') = 1 - P(A) \\]", "vars": ""}, {"latex": "\\[ P(A - B) = P(A) - P(A\\cap B) \\]", "vars": ""}]}, {"type": "example", "title": "Example (Standard) — Cards & Dice <span class='src'>[SOURCE SOLVED]</span>", "problem": "(i) A card is drawn from a deck of 52 cards. Find probability of (a) an ace, (b) a red card. (ii) Two dice are rolled. Find probability that the sum is 7.", "asked": "Classical counting with careful sample space.", "given": "(i) 52 cards; (ii) 36 outcomes.", "method": "Favorable/total.", "formula": null, "steps": ["(i) P(ace) = 4/52 = 1/13; P(red) = 26/52 = 1/2.", "(ii) Favorable pairs: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) → 6 outcomes. P(sum=7) = 6/36 = 1/6."], "answer": "P(ace) = 1/13; P(red) = 1/2; P(sum 7) = 1/6", "tip": "Enumerate pairs — don't guess."}, {"type": "list", "title": "Common Mistakes", "items": ["Multiplication formula ignore karna in dependent cases.", "Bayes formula mein P(B) = ΣP(B|Ai)P(Ai) na banana (enrichment).", "Without-replacement independent maan lena."]}]}]}, {"id": "u4", "title": "Unit 4 — Random Variables & Probability Distributions", "sub": "Official course blueprint: Lecture 3.3 Random Variables, 3.4 Binomial, 3.5 Poisson, 3.6 Continuous/Normal distribution.", "topics": [{"id": "t41", "code": "Lecture 3.3", "title": "Random Variables, p.m.f., p.d.f. & Distribution Function", "sections": [{"type": "def", "title": "Formal Definition — Random Variable", "formal": "A random variable is a real-valued function whose domain is the set of possible outcomes of a random experiment and whose range is a subset of the set of real numbers, with the properties: (I) each particular value of the random variable can be assigned some probability, and (II) the sum of all probabilities associated with all values equals 1 (unity).", "hinglish": "Sample space ke outcomes ko real numbers map karte hain — e.g., die twice thrown, X = 'number of odd results' takes 0, 1, 2 with probabilities summing to 1. Notation: capital letters X, Y, Z; 'r.v.' shorthand (source remark).", "keywords": ["real-valued function", "domain = outcomes", "ΣP = 1"]}, {"type": "def", "title": "Formal Definition — Discrete Random Variable", "formal": "A random variable is said to be discrete if it has either a finite or a countable number of values (one-to-one correspondence with the natural numbers).", "hinglish": "Countable values = sequence mein arrange — students present per day, defective counts. Fractional values nahi le sakta.", "keywords": ["countable", "one-to-one with N", "finite or sequence"]}, {"type": "def", "title": "Formal Definition — Continuous Random Variable", "formal": "A random variable is said to be continuous if it can take all possible real (integer as well as fractional) values between two certain limits; values cannot be arranged in a sequence.", "hinglish": "Temperature over a day, race finish time — uncountable values. Point probability = 0 for continuous r.v.; only interval probabilities calculable (integrals).", "keywords": ["uncountable", "real interval", "P(X = a) = 0"]}, {"type": "def", "title": "Formal Definition — Probability Mass Function (p.m.f.)", "formal": "Let X be a random variable taking values x₁, x₂, … and let P[X = xᵢ] = p(xᵢ). This function p(xᵢ) defined for the values assumed by X is called the probability mass function, satisfying p(xᵢ) ≥ 0 and Σ p(xᵢ) = 1.", "hinglish": "p.m.f. discrete variable ke har value ki probability assign karta hai. Distribution set {(xᵢ, p(xᵢ))} se specify hota hai.", "keywords": ["p(xᵢ) ≥ 0", "Σp(xᵢ)=1", "discrete"]}, {"type": "def", "title": "Formal Definition — Probability Density Function (p.d.f.)", "formal": "f(x) is called a probability density function if the probability that X lies in (x, x+dx) equals f(x)dx, with f(x) ≥ 0 and ∫ f(x)dx = 1 over the entire range of X.", "hinglish": "Interval probability = integral area. P[a < X < b] = ∫ from a to b of f(x) dx. (Source: P[X takes exact value] = 0 for continuous.)", "keywords": ["f(x) ≥ 0", "∫f(x)dx = 1", "P[a<X<b]=∫f dx"]}, {"type": "def", "title": "Formal Definition — Distribution Function (c.d.f.)", "formal": "A function F defined for all values of a random variable X by F(x) = P[X ≤ x] is called the distribution function; it is the cumulative probability up to and including x. Domain = real numbers; range = [0, 1].", "hinglish": "X cumulative probability track karta hai. Discrete c.d.f. = running sum; continuous mein F(x) = integral of p.d.f., and f(x) = F′(x) (source).", "keywords": ["F(x) = P(X ≤ x)", "cumulative", "range [0,1]"]}, {"type": "list", "title": "pmf vs pdf vs cdf (from source text)", "items": ["Discrete: p.m.f. p(xᵢ) per value; sum = 1.", "Continuous: p.d.f. f(x); point probability = 0; interval probability = integral.", "c.d.f. F(x) = P(X ≤ x); F′(x) = f(x) for continuous r.v."]}, {"type": "example", "title": "Example 1 (Standard) — Valid probability distribution? <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "Check whether these are probability distributions: (i) X: 0, 1 with P(X): 1/2, 3/4; (ii) X: 0,1,2 with P(X): 1/3, −1/4, 3/4; (iii) X: 0..3 with P: 1/8, 3/8, 1/4, 1/8.", "asked": "Σp = 1 & each p ≥ 0 check karo.", "given": null, "method": null, "formula": null, "steps": ["(i) Σp = 1/2 + 3/4 = 5/4 > 1 → not a probability distribution.", "(ii) one probability negative → not a distribution.", "(iii) Σp = 1/8 + 3/8 + 1/4 + 1/8 = 7/8 < 1 → not a distribution."], "answer": "None of the given tables is a valid probability distribution", "tip": "Dono conditions check karo — sign & sum."}, {"type": "example", "title": "Example 2 (Exam) — p.d.f. parameter & interval probabilities <span class='src'>[SOURCE QUESTION + GENERATED SOLUTION]</span>", "problem": "A continuous r.v. X has p.d.f. f(x) = A x³ for 0 ≤ x ≤ 1. Determine (i) A, (ii) P[0.2 < X < 0.5], (iii) P[X > 3/4 | X > 1/2].", "asked": "(i) total integral 1; (ii) integrate; (iii) conditional rule.", "given": "f(x) = A x³ on [0,1].", "method": "∫f dx = 1; conditional P(E|F) = P(E∩F)/P(F).", "formula": "\\[ \\int_0^1 A x^3 dx = 1,\\quad P[a<X<b] = \\int_a^b f dx \\]", "steps": ["A × [x⁴/4]₀¹ = 1 → A = 4.", "P[0.2<X<0.5] = 4 × [x⁴/4]₀.₂⁰.⁵ = (0.5)⁴ − (0.2)⁴ = 0.0625 − 0.0016 = 0.0609.", "P[X>3/4 & X>1/2] = P[X>3/4] = 1 − (3/4)⁴ = 175/256.", "P[X>1/2] = 1 − (1/2)⁴ = 15/16.", "Required = (175/256)/(15/16) = 35/48."], "answer": "A = 4; P(0.2<X<0.5) = 0.0609; conditional probability = 35/48", "tip": "Conditional probability = intersection rule with p.d.f."}, {"type": "example", "title": "Example 3 (Standard) — Distribution function of discrete r.v. <span class='src'>[SOURCE SOLVED]</span>", "problem": "X takes 0,1,2 with p(x) = 1/4, 1/2, 1/4. Write its distribution function F(x).", "asked": "Running cumulative sums.", "given": null, "method": null, "formula": null, "steps": ["F(0) = 1/4.", "F(1) = 1/4 + 1/2 = 3/4.", "F(2) = 1/4 + 1/2 + 1/4 = 1."], "answer": "F = {1/4, 3/4, 1}", "tip": "Last value must be 1."}, {"type": "text", "title": "Expected Value of a Random Variable (concept from source)", "body": "Expected value is the fundamental idea in probability distributions: for a discrete r.v., multiply each value by its probability and sum all products — E(X) = Σ xᵢ p(xᵢ). This is the discrete weighted mean. Applications follow in later parts (source note: daily visa cleared example in unit context)."}]}, {"id": "t42", "code": "Lecture 3.4", "title": "Binomial Distribution", "sections": [{"type": "text", "title": "Introduction", "body": "Binomial distribution swiss mathematician James Bernoulli (1654-1705) se hua — dichotomous outcomes (success/failure) wale repeated trials. Quality control mein defective probability nikaalne ka standard tool."}, {"type": "list", "title": "Binomial law applies only when (source)", "items": ["Each trial results in either success or failure", "The probability of success p remains constant in each trial", "Trials are mutually independent", "The number of trials is known (1, 2, 3, …, n)"]}, {"type": "formula", "title": "Binomial formula & measures", "items": [{"latex": "\\[ P(r) = \\binom{n}{r} p^r q^{n-r},\\quad q = 1 - p \\]", "vars": "P(r) = probability of r successes in n trials."}, {"latex": "\\[ \\binom{n}{r} = \\frac{n!}{r!(n-r)!} \\]", "vars": "0! = 1."}, {"latex": "\\[ \\mu = n p \\]", "vars": "Mean."}, {"latex": "\\[ \\sigma = \\sqrt{n p q} \\]", "vars": "Standard deviation."}]}, {"type": "list", "title": "Characteristics (source)", "items": ["Distribution form depends on parameters p and n.", "If p < 0.5 → positively skewed; p > 0.5 → negatively skewed; p = q → symmetrical.", "Mainly for infinite populations; finite OK if sampling with replacement."]}, {"type": "example", "title": "Example 1 (Exam) — Six coin tosses <span class='src'>[SOURCE QUESTION + GENERATED SOLUTION]</span>", "problem": "A fair coin is tossed six times. What is the probability of obtaining four or more heads?", "asked": "r = 4, 5, 6 terms sum karo.", "given": "n = 6, p = q = 1/2.", "method": "P(4)+P(5)+P(6).", "formula": "\\[ P(r) = \\binom{6}{r}(1/2)^6 \\]", "steps": ["P(4) = C(6,4)/64 = 15/64; P(5) = 6/64; P(6) = 1/64.", "Sum = (15+6+1)/64 = 22/64 = 11/32 ≈ 0.3438."], "answer": "P(4 or more heads) = 11/32 ≈ 0.3438", "tip": "Cumulative range problems → enumerate required r values."}, {"type": "example", "title": "Example 2 (Exam) — Mean & S.D. of defective bolts <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "If the probability of defective bolts is 0.1, find the mean and standard deviation for the distribution of defective bolts in a total of 500.", "asked": "μ = np, σ = √(npq).", "given": "n = 500, p = 0.1, q = 0.9.", "method": null, "formula": null, "steps": ["μ = 500 × 0.1 = 50.", "σ = √(500 × 0.1 × 0.9) = √45 = 6.71."], "answer": "μ = 50 bolts; σ ≈ 6.71 bolts", "tip": "npq root — don't square p·q first."}, {"type": "text", "title": "Fitting a Binomial Distribution (source procedure)", "body": "Steps: (i) determine p and q (p = 1−q); (ii) expand (p+q)ⁿ — number of terms = n+1; (iii) multiply each term by N (total frequency) to get expected frequencies. p = q → symmetric; p < 0.5 → positively skewed."}, {"type": "example", "title": "Example 3 (Exam) — Fitting binomial & comparing observations <span class='src'>[SOURCE SOLVED]</span>", "problem": "Eight coins tossed 256 times. Fit binomial with p = q = 1/2 and find theoretical mean and S.D.; observed mean/S.D. computed for comparison.", "asked": "(p+q)⁸ expansion × N; μ = np, σ = √(npq).", "given": "n = 8, N = 256.", "method": "Binomial expansion coefficients × 256.", "formula": null, "steps": ["Expected counts = 256 × C(8, r) / 256 → C(8,r) integers: 1, 8, 28, 56, 70, 56, 28, 8, 1.", "μ = np = 8 × 1/2 = 4; σ = √(8×0.5×0.5) = √2 = 1.414.", "Observed: mean 4.062, S.D. 1.462 — close ⇒ fit is good."], "answer": "μ = 4, σ = 1.414; expected frequencies close to observed", "tip": "Fit quality → compare expected vs observed. <span class='src'>[SOURCE]</span>"}, {"type": "try", "problem": "a) n=4, p=0.12, find P(0). b) n=10, p=0.40, find P(9). c) n=6, p=0.83, find P(5). <span class='src'>[SOURCE PRACTICE QUESTION]</span>", "hint": "Soch: pick correct r and plug into binomial formula.", "answer": "a) ≈0.599; b) ≈0.2424; c) ≈0.7944? (verify) <span class='src'>[ANSWER GENERATED]</span>", "solution": ["a) P(0) = (0.88)⁴ ≈ 0.5997.", "b) P(9) = C(10,9)(0.4)⁹(0.6) = 10 × 0.000262144 × 0.6 ≈ 0.00157.", "c) P(5) = C(6,5)(0.83)⁵(0.17) = 6 × 0.3939 × 0.17 ≈ 0.4016."]}, {"type": "try", "problem": "Data: 5 coins tossed 3100 times; heads 0..5 with frequencies 32,225,710,1085,820,228. Find expected (fit) and theoretical mean, S.D. <span class='src'>[SOURCE PRACTICE QUESTION]</span>", "hint": "Estimate p from data mean (np), n = 5.", "answer": "Fit with data mean ≈ Σfx/Σf; expand (p+q)⁵ × 3100. <span class='src'>[ANSWER GENERATED method]</span>", "solution": null}, {"type": "list", "title": "Common Mistakes", "items": ["q = 1 − p bhoolna.", "Constant-p check ignore karna.", "Mean np aur SD √(npq) formulas interchange karna."]}]}, {"id": "t43", "code": "Lecture 3.5", "title": "Poisson Distribution", "sections": [{"type": "text", "title": "Introduction", "body": "Poisson (developed by French mathematician Simeon Poisson) counts rare events in a time/space region — deaths/accidents in a specific time, production defects,.absentees per day. Binomial with p very small (< 0.01 even) and n large (> 50) — np constant → Poisson limit."}, {"type": "formula", "title": "Poisson formula & measures", "items": [{"latex": "\\[ P(r) = \\frac{m^r e^{-m}}{r!},\\quad m = np \\]", "vars": "r = 0,1,2,…; e = 2.7183."}, {"latex": "\\[ \\mu = m = np,\\quad \\sigma = \\sqrt{m} \\]", "vars": "Mean = variance = np = m."}]}, {"type": "list", "title": "Characteristics (source)", "items": ["Discrete — limiting form of binomial.", "Range of random variable: 0 ≤ r < ∞.", "Single parameter m; entire distribution known from m.", "Positively skewed; skewness decreases as m increases."]}, {"type": "example", "title": "Example 1 (Exam) — Defective toys <span class='src'>[SOURCE QUESTION + SOURCE ANSWER]</span>", "problem": "2% of electronic toys in a manufacturing process turn out defective. What is the probability that a shipment of 200 toys will contain exactly 5 defectives? Also find mean and S.D.", "asked": "Small p, large n → Poisson with m = np.", "given": "n = 200, p = 0.02, m = 4.", "method": "P(5) = m⁵e⁻ᵐ/5!.", "formula": "\\[ P(r) = \\frac{m^r e^{-m}}{r!} \\]", "steps": ["P(5) = (4⁵ × e⁻⁴)/120 = (1024 × 0.0183)/120 = 0.156.", "Mean = 4; σ = √4 = 2."], "answer": "P(5 defectives) ≈ 0.156; μ = 4; σ = 2", "tip": "n large + p small → Poisson approximation saves factorial work. <span class='src'>[SOURCE]</span>"}, {"type": "example", "title": "Example 2 (Challenging) — Binomial vs Poisson comparison <span class='src'>[SOURCE SOLVED]</span>", "problem": "Probability of defects in each tool is 0.02. Find probability of exactly 4 defective tools in a sample of 30 using (i) Binomial, (ii) Poisson.", "asked": "Compare exact vs approximation.", "given": "n = 30, p = 0.02.", "method": "Both formulas side by side.", "formula": null, "steps": ["(i) Binomial P(4) = C(30,4)(0.02)⁴(0.98)²⁶ = 27405 × 1.6e-7 × 0.59 = 0.00259.", "(ii) Poisson: m = np = 0.6; P(4) = (0.6⁴ e⁻⁰.⁶)/24 ≈ 0.00296."], "answer": "Binomial = 0.00259; Poisson ≈ 0.00296 — close approximation", "tip": "Poisson approximation accuracy n small p par hi realistic. <span class='src'>[SOURCE]</span>"}, {"type": "text", "title": "Fitting a Poisson Distribution (source procedure)", "body": "Procedure: (1) get mean m = np from data; (2) compute P(r) = m^r e⁻ᵐ/r!; (3) multiply each probability by total frequency N → expected frequencies."}, {"type": "try", "problem": "On average 2% of bulbs are defective. If 100 produced per day, probability that 4 bulbs are defective? <span class='src'>[SOURCE PRACTICE QUESTION]</span>", "hint": "m = np = 2.", "answer": "P(4) = (2⁴ e⁻²)/24 ≈ 0.0902 <span class='src'>[ANSWER GENERATED]</span>", "solution": ["P(4) = (16/24) × e⁻² = (2/3) × 0.1353 ≈ 0.0902."]}, {"type": "try", "problem": "400 car ACs inspected; defects per set: 0,1,2,3,4,5 with frequencies 142,156,69,27,5,1. Find expected frequencies (Poisson fit). <span class='src'>[SOURCE PRACTICE QUESTION]</span>", "hint": "Compute data mean m ≈ Σfx/400, then P(r)×400.", "answer": "Method: mean ≈ (156+2*69+3*27+4*5+5*1)/400 = (156+138+81+20+5)/400 = 400/400 = 1 → expected ≈ 400 × e⁻¹/r!. <span class='src'>[ANSWER GENERATED method]</span>", "solution": null}, {"type": "list", "title": "Common Mistakes", "items": ["m = np nikaalte time p se multiply na karna.", "Poisson applicable check na karna (p small, n large).", "σ = √m instead of √(npq)."]}]}, {"id": "t44", "code": "Lecture 3.6", "title": "Continuous Probability Distributions — Normal", "sections": [{"type": "text", "title": "Introduction", "body": "Continuous random variable = infinite possible values in a range (reservoir level example in source). Normal distribution = most versatile continuous distribution — defined by two parameters μ (mean) and σ (S.D.)."}, {"type": "list", "title": "Characteristics of Normal Distribution (source)", "items": ["Unimodal — single peak, bell-shaped.", "Symmetric (skewness = 0) — mean, median, mode all same.", "Two tails extend indefinitely but never touch the horizontal axis."]}, {"type": "formula", "title": "Standard normal conversion", "items": [{"latex": "\\[ Z = \\frac{X - \\mu}{\\sigma} \\]", "vars": "Z = number of standard deviations from X to the mean."}]}, {"type": "formula", "title": "Areas under the normal curve (source)", "items": [{"latex": "\\[ \\mu \\pm 1\\sigma : 68\\%\\ (34.13\\% \\text{ each side}) \\]", "vars": ""}, {"latex": "\\[ \\mu \\pm 2\\sigma : 95.5\\%\\ (47.75\\% \\text{ each side}) \\]", "vars": ""}, {"latex": "\\[ \\mu \\pm 3\\sigma : 99.7\\%\\ (49.85\\% \\text{ each side}) \\]", "vars": ""}, {"latex": "\\[ \\text{Total area under curve} = 1 \\]", "vars": ""}]}, {"type": "text", "title": "Using the Standard Normal Table (source steps)", "body": "Step 1: convert X to Z = (X − μ)/σ. Step 2: look up table value (area between 0 and Z). Right of positive Z area = 0.5 − table; left of positive Z = 0.5 + table; symmetric for negative values."}, {"type": "example", "title": "Example 1 (Standard) — Reading the table <span class='src'>[SOURCE SOLVED]</span>", "problem": "(a) Find the area under the normal curve for Z = 1.54. (b) Z = −1.46. (c) Area to the right of Z = 0.25. (d) Area to the left of Z = 1.83.", "asked": "Table value = area between mean and Z.", "given": null, "method": null, "formula": null, "steps": ["(a) area 0.4382.", "(b) symmetry → 0.4279.", "(c) 0.5 − 0.0987 = 0.4013.", "(d) 0.5 + 0.4664 = 0.9664."], "answer": "(a) 0.4382 (b) 0.4279 (c) 0.4013 (d) 0.9664", "tip": "Right side subtract 0.5; left side add 0.5."}, {"type": "example", "title": "Example 2 (Exam) — Soldiers above six feet <span class='src'>[SOURCE SOLVED]</span>", "problem": "Mean height of soldiers = 68.22 inches, variance = 10.8. How many in a regiment of 1000 would be over six feet (72 in) tall?", "asked": "Z = (72 − 68.22)/√10.8.", "given": "σ = √10.8 = 3.286.", "method": "Right-tail area = 0.5 − table(Z).", "formula": null, "steps": ["Z = 3.78/3.286 ≈ 1.15 → table = 0.3749.", "Right area = 0.5 − 0.3749 = 0.1251.", "Expected = 1000 × 0.1251 = 125.1 ≈ 125."], "answer": "About 125 soldiers over six feet", "tip": "Variance diya hai → σ = √variance pehle. <span class='src'>[SOURCE]</span>"}, {"type": "example", "title": "Example 3 (Exam) — Training programme durations <span class='src'>[SOURCE SOLVED]</span>", "problem": "Mean time of a normally distributed programme = 500 hours, S.D. = 100 hours. Find probability that a participant will take: (i) fewer than 570 hours; (ii) between 430 and 580 hours.", "asked": "Convert to Z, use 0.5 ± table logic.", "given": "μ = 500, σ = 100.", "method": "(i) left area; (ii) combined symmetric side areas.", "formula": null, "steps": ["(i) Z = 70/100 = 0.7 → table 0.2580 → total = 0.5 + 0.2580 = 0.7580.", "(ii) Z₁ = −70/100 = −0.7 → 0.2580; Z₂ = 80/100 = 0.8 → 0.2881; total = 0.5461."], "answer": "(i) ≈ 75.8%; (ii) ≈ 54.6%", "tip": "Two-sided intervals → add both table values. <span class='src'>[SOURCE]</span>"}, {"type": "list", "title": "Purpose & applications (source)", "items": ["Fit distribution of measurement, approximate binomial & Poisson, sampling distributions (mean, variance).", "Initial discovery: studying random errors in astronomical orbit computations.", "Industrial quality control, testing of significance, sampling distribution, graduation of non-normal curve."]}, {"type": "try", "problem": "Standard normal: find probability (a) Z < 1.08, (b) Z > −0.21, (c) between mean and +1.08, (d) between mean & 1.06 minus? (source list partially garbled). <span class='src'>[SOURCE]</span>", "hint": "0.5 ± table logic.", "answer": "Answers depend on table values — use Z-table. <span class='src'>[QUESTION PARIALLY INCOMPLETE IN SOURCE]</span>", "solution": null}, {"type": "try", "problem": "Normal with μ = 100, σ = 10: find (a) P(X>75) (b) P(X<70) (c) P(X>112) (d) P(75<X<85)? (e) P(X<80 or X>110). <span class='src'>[SOURCE PRACTICE QUESTION]</span>", "hint": "Compute each Z then table.", "answer": "Z values: −2.5, −3, 1.2 → typical answers derive from table. <span class='src'>[ANSWER GENERATED method]</span>", "solution": null}, {"type": "list", "title": "Common Mistakes", "items": ["Area right of positive Z → 0.5 − table (not table).", "Variance se σ nikaalna bhoolna.", "Symmetry misuse for negative Z."]}]}]}]};
